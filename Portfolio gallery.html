<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Portfolio - Thumbnail Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF3366;
            --secondary: #6C63FF;
            --accent: #FFD700;
            --dark: #0A0A0F;
            --light: #F5F5F7;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--dark);
            color: var(--light);
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 40px 5%;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.8rem;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .back-btn {
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--accent);
            color: var(--dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 51, 102, 0.3);
        }

        /* Main Content */
        .portfolio-section {
            padding: 100px 5%;
        }

        .portfolio-title {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(3rem, 8vw, 6rem);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        .portfolio-subtitle {
            text-align: center;
            font-size: 1.2rem;
            opacity: 0.7;
            margin-bottom: 80px;
        }

        /* Gallery Grid */
        .portfolio-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 50px;
            max-width: 1400px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .portfolio-card {
            position: relative;
            aspect-ratio: 16/9;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .portfolio-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 1;
            display: none;
        }

        .portfolio-card:hover::before {
            opacity: 0.8;
            display: none;
        }

        .portfolio-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 70px rgba(255, 51, 102, 0.3);
        }

        .portfolio-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
            display: block;
        }

        .portfolio-card:hover .portfolio-img {
            transform: scale(1.05);
        }

        .portfolio-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 2;
        }

        .portfolio-card:hover .portfolio-overlay {
            opacity: 0;
            display: none;
        }

        .portfolio-overlay h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 0.1em;
            transform: translateY(20px);
            transition: transform 0.6s ease;
        }

        .portfolio-card:hover .portfolio-overlay h3 {
            transform: translateY(0);
        }

        .portfolio-overlay p {
            font-size: 0.9rem;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.6s ease 0.1s;
        }

        .portfolio-card:hover .portfolio-overlay p {
            transform: translateY(0);
        }

        /* Footer */
        footer {
            padding: 60px 5%;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            margin-top: 100px;
        }

        footer p {
            opacity: 0.6;
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            .portfolio-gallery {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .portfolio-title {
                margin-top: 30px;
            }
        }
    </style>
</head>
<body>
